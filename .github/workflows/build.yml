name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libmpv-dev libxkbcommon-dev libwayland-dev \
            libx11-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libfontconfig1-dev libfreetype-dev libgl1-mesa-dev libegl1-mesa-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --bin vynz
      - name: Build release
        run: cargo build --release --bin vynz
      - name: Package Linux archive
        run: |
          mkdir -p dist/vynz-linux-x86_64
          cp target/release/vynz LICENSE README.md dist/vynz-linux-x86_64/
          tar -C dist -czf vynz-linux-x86_64.tar.gz vynz-linux-x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: vynz-linux-x86_64
          path: vynz-linux-x86_64.tar.gz

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Download libmpv-2.dll and generate mpv.lib
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $rel = Invoke-RestMethod -Uri "https://api.github.com/repos/shinchiro/mpv-winbuild-cmake/releases/latest" -Headers @{ "User-Agent" = "vynz-ci" }
          $asset = $rel.assets | Where-Object { $_.name -match "^mpv-dev-x86_64-\d+.*\.7z$" -and $_.name -notmatch "v3" } | Select-Object -First 1
          if (-not $asset) { throw "mpv-dev-x86_64 asset bulunamadi" }
          Write-Host "Downloading $($asset.name)"
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile mpv-dev.7z
          7z x mpv-dev.7z -ompv-dev -y | Out-Null
          $dll = Get-ChildItem -Path mpv-dev -Recurse -Filter "*mpv*.dll" | Select-Object -First 1
          if (-not $dll) {
            Get-ChildItem -Path mpv-dev -Recurse | Select-Object FullName
            throw "libmpv DLL bulunamadi"
          }
          New-Item -ItemType Directory -Force -Path mpv-lib | Out-Null
          Copy-Item $dll.FullName "mpv-lib/$($dll.Name)"
          $def = Get-ChildItem -Path mpv-dev -Recurse -Filter "*.def" | Select-Object -First 1
          if ($def) {
            $defPath = $def.FullName
          } else {
            $defPath = "mpv-lib/mpv.def"
            $exports = dumpbin /exports $dll.FullName | ForEach-Object {
              if ($_ -match "^\s+\d+\s+[0-9A-Fa-f]+\s+[0-9A-Fa-f]+\s+(\S+)") { $Matches[1] }
            }
            @("LIBRARY $($dll.Name)", "EXPORTS") + $exports | Set-Content -Path $defPath -Encoding ASCII
          }
          lib.exe /def:"$defPath" /name:"$($dll.Name)" /out:mpv-lib/mpv.lib /machine:x64
          $libDir = (Resolve-Path mpv-lib).Path
          "RUSTFLAGS=-L native=$libDir" | Out-File -FilePath $env:GITHUB_ENV -Append
          "$libDir" | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: Test
        run: cargo test --bin vynz
      - name: Build release
        run: cargo build --release --bin vynz
      - name: Package Windows portable zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/vynz-windows-x86_64 | Out-Null
          Copy-Item target/release/vynz.exe dist/vynz-windows-x86_64/
          Copy-Item mpv-lib/*.dll dist/vynz-windows-x86_64/
          Copy-Item LICENSE, README.md dist/vynz-windows-x86_64/
          Compress-Archive -Path dist/vynz-windows-x86_64/* -DestinationPath vynz-windows-x86_64.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: vynz-windows-x86_64
          path: vynz-windows-x86_64.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums (uygulama içi güncelleyici doğrular)
        run: |
          cd artifacts
          sha256sum vynz-linux-x86_64.tar.gz vynz-windows-x86_64.zip > SHA256SUMS
          cat SHA256SUMS
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ -f "notes/${TAG}.md" ]; then
            FLAGS="--notes-file notes/${TAG}.md"
          else
            FLAGS="--generate-notes"
          fi
          # Sürüm adı: v0.2.0 → "Vynz 0.2.0"; tire içeren etiketler (v0.3.0-beta.1) ön sürüm sayılır
          # ve uygulama içi güncelleyiciye görünmez.
          if [[ "$TAG" == *-* ]]; then
            FLAGS="$FLAGS --prerelease"
          fi
          gh release create "$TAG" artifacts/* -R "${{ github.repository }}" --title "Vynz ${TAG#v}" $FLAGS

