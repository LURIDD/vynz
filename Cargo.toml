[package]
name = "vynz"
version = "0.1.0"
edition = "2024"
description = "Multi-source desktop music player (YouTube Music, SoundCloud, Spotify import) in Rust + Slint"
license = "MIT"
repository = "https://github.com/LURIDD/vynz"

[dependencies]
async-channel = "2.5.0"
async-io = "2.6.0"
ctrlc = { version = "3.5.2", features = ["termination"] }
dirs = "6"
futures-lite = "2.6.1"
image = "0.25.10"
libmpv2 = "7"
mpris-server = "0.11"
open = "5"
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "tokio"] }
roxmltree = "0.21.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
slint = "1.18"
starship-battery = "0.10"
sysinfo = { version = "0.33", default-features = false, features = ["network"] }
ttf-parser = "0.25.1"
ureq = "3.5.2"

[build-dependencies]
slint-build = "1.18"

[profile.release]
lto = "thin"
strip = true
