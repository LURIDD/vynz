[package]
name = "vynz"
version = "0.1.0"
edition = "2024"
description = "Multi-source desktop music player (YouTube Music, SoundCloud, Spotify import) in Rust + Slint"
license = "MIT"
repository = "https://github.com/LURIDD/vynz"

[dependencies]
ctrlc = { version = "3.5.2", features = ["termination"] }
dirs = "6"
flate2 = "1"
image = "0.25.10"
libmpv2 = "7"
open = "5"
roxmltree = "0.21.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
slint = { version = "1.18", features = ["unstable-winit-030"] }
starship-battery = "0.10"
sysinfo = { version = "0.33", default-features = false, features = ["network"] }
tar = "0.4"
ttf-parser = "0.25.1"
ureq = "3.5.2"
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(target_os = "linux")'.dependencies]
async-channel = "2.5.0"
async-io = "2.6.0"
futures-lite = "2.6.1"
mpris-server = "0.11"
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "tokio"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
rfd = "0.15"

[target.'cfg(target_os = "windows")'.dependencies]
souvlaki = "0.8"
tray-icon = "0.19"
windows = { version = "0.58", features = [
    "Networking_Connectivity",
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
slint-build = "1.18"

[target.'cfg(target_os = "windows")'.build-dependencies]
winresource = "0.1"

[profile.release]
lto = "thin"
strip = true
